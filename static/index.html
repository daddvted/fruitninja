<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>FruitNinja</title>
</head>

<body>
  <p>
    <button onclick="simpleTest()">simple test</button>
  </p>
  <p>
    <button onclick="counterTest()">counter test</button>
    <input id="num" type="number" min="0" value="10"></input>
  </p>
  <p>
    <button onclick="cleanup()">clean</button>
    <button onclick="stopTest()">stop</button>
  </p>
  <!-- Result -->
  <p id="client"></p>
  <p id="server"></p>
  <p id="stats"></p>

  <script>
    const fruits = [
      "apple", "banana", "cherry", "coconut", "grape", "kiwi",
      "lemon", "mango", "orange", "peach", "pear", "pineapple",
      "strawberry", "tomato", "watermelon", "blade"
    ]

    let dict = {};
    let ws = null;
    let intervalId = null;

    function randomChoice(list) {
      const randomIndex = Math.floor(Math.random() * list.length)
      return list[randomIndex]
    }

    function updateDict(key) {
      if (key.toLowerCase().startsWith('welcome')) return;
      dict[key] = (dict[key] || 0) + 1;
    }

    function updateStats() {
      const stats = document.getElementById('stats')
      const statsText = "统计：<br/>" +
        Object.entries(dict)
          .map(([key, value]) => `${key}: ${value}`)
          .join('<br/>');
      stats.innerHTML = statsText;
    }

    function connectWebSocket() {
      const loc = window.location;
      const scheme = loc.protocol === 'https:' ? 'wss' : 'ws';
      const uri = `${scheme}://${loc.host}/ws`;

      ws = new WebSocket(uri);

      ws.onopen = function () {
        console.log('Connected');
      };

      ws.onmessage = function (event) {
        console.log(`got ${event.data}`);
        updateDict(event.data);
        document.getElementById('server').innerHTML = '服务器响应: ' + event.data;
        updateStats();
      };

      ws.onerror = function (event) {
        console.log("Oops! ws error:", event);
        console.log(`___________: ${counter}`);
      };

      ws.onclose = function (event) {
        console.log("Closed:", event);
        ws = null;
      };
    }

    function startTest(tt, total) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket();
      }

      let counter = 1;

      intervalId = setInterval(function () {
        let fruit = "";
        if (ws && ws.readyState === WebSocket.OPEN) {
          if (tt == "simple") {
            fruit = randomChoice(fruits);
            document.getElementById('client').innerHTML = '客户端请求: ' + fruit;
            console.log(`send ${fruit} to server`);
            ws.send(fruit);
            updateStats();
          } else {
            if (counter <= total) {
              fruit = counter.toString();
              document.getElementById('client').innerHTML = '客户端请求: ' + fruit;
              console.log(`send ${fruit} to server`);
              console.log(`${counter}/${total}`);
              ws.send(fruit);
              counter++;
              updateStats();
            } else {
              stopTest();
            }
          }
        }
      }, 1000);
    }

    function stopTest() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
      }
    }

    function simpleTest() {
      startTest("simple");
    }

    function counterTest() {
      const input = document.getElementById('num')
      const value = input.valueAsNumber;
      startTest("counter", value);
    }

    function cleanup() {
      document.getElementById('stats').innerHTML = "";
      document.getElementById('client').innerHTML = "";
      document.getElementById('server').innerHTML = "";
      dict = {};
    }
  </script>
</body>

</html>
